name: Validate bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - name: Require a version bump for published bundle changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs "${{ github.event.pull_request.base.sha }}" HEAD
      - run: node --test scripts/*.test.mjs
      - run: node scripts/evaluate-external-trace.mjs new-agent-workspace-scene-one evals/fixtures/new-agent-workspace-scene-one.trace.json
      - run: node scripts/evaluate-external-trace.mjs film-scene-readiness-blocks-generation evals/fixtures/film-scene-readiness-blocks-generation.trace.json
      - run: node scripts/evaluate-external-trace.mjs generate-despite-open-asset-locks evals/fixtures/generate-despite-open-asset-locks.trace.json
      - run: node scripts/evaluate-external-trace.mjs surgical-take-iteration evals/fixtures/surgical-take-iteration.trace.json
      - run: node scripts/evaluate-external-trace.mjs seedance-capability-is-not-creative-fit evals/fixtures/seedance-capability-is-not-creative-fit.trace.json
      - run: node scripts/evaluate-external-trace.mjs location-floor-map-before-definition evals/fixtures/location-floor-map-before-definition.trace.json
      - run: node scripts/evaluate-external-trace.mjs repeat-generation-announced-as-take evals/fixtures/repeat-generation-announced-as-take.trace.json
